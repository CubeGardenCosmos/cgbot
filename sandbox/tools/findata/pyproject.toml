[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "findata"
version = "1.0.0"
description = "Normalized public market data for cgbot sandbox agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
findata = "findata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
