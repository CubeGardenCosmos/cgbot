# cgbot 配置示例。复制为本地配置文件(如 config.toml)后修改;该本地文件不入库。
#
# 密钥只在此处写引用名,值不写在本文件。取值顺序:
#   1. 环境变量 CGBOT_SECRET_<名字大写>(优先)
#   2. secrets 文件的 [secrets] 表;路径由 load_config 参数或环境变量 CGBOT_SECRETS_FILE 指定,
#      权限须为 0600,且不入库。示例(值为占位):
#        [secrets]
#        provider_api_key = "<填入真实密钥>"
#
# 未知键、缺失必填项、非法取值都会启动失败,错误信息给出键路径。

[napcat]
# 框架是 WebSocket 服务端,NapCat 以反向 WS 客户端连入。
host = "127.0.0.1"   # 监听地址;NapCat 与框架不同机时改为内网地址或 0.0.0.0
port = 6199          # 必填
path = "/ws"         # 默认 /ws
# token_ref = "napcat_token"  # 可选;引用 secrets 中的密钥名。省略则不校验令牌

[scope]
# 服务范围白名单。范围外的私聊/群消息在进入业务与 LLM 之前丢弃。
# 私聊:发送者须在 friends;群聊:群号须在 groups(群内任何成员均在范围内)。
# 省略整节 = 全部拒绝。
friends = []         # 好友 QQ 号,纯数字,例:[10000000001, 10000000002]
groups = []          # 固定群号,纯数字
# owner = 10000000000  # 可选:主人 QQ 号,仅作身份标记,不会自动加入白名单

[provider]
base_url = "https://example.invalid/v1"  # 上游根地址;responses 请求 {base_url}/responses,chat 请求 {base_url}/chat/completions
model = "your-model-name"
wire_api = "responses"              # responses(默认,OpenAI Responses 兼容)| chat(Chat Completions 兼容)
context_window = 128000             # 上游模型上下文窗口,token 数,正整数,必填
api_key_ref = "provider_api_key"         # 密钥引用名,值见文件头说明

[provider.reasoning]
# 各用途的推理档位,原样透传给上游(上游对档位取值的支持待实测)。
summary = "low"      # 压缩摘要
private = "high"     # 日常私聊
planning = "max"     # 任务规划(设计待定)
group = "low"        # 群聊轮次

[storage]
data_dir = "data"    # 相对本配置文件所在目录;运行时数据,不入库
# 每个域一个独立的 SQLite 文件(第二十轮:不再共用单库):
#   profile.sqlite    身份与入口等用户资料
#   sessions.sqlite   聊天记录(会话日志)
#   scheduler.sqlite  调度器系统事件(记忆本等后续模块各用 <模块名>.sqlite)

[group]
wake_keywords = ["大肥鱼"]  # 唤醒关键词:@ 机器人且消息含关键词才唤醒
mute_keywords = []          # 闭嘴关键词,默认为空(具体规则在群聊里程碑中确定)
# 群聊会话与技能上限(默认值为推论,待实测调整)
idle_timeout_seconds = 600  # 群会话空闲多少秒后结束
max_turns = 30              # 单次群会话最多轮数
skill_topics = 8            # 群技能:话题条数上限
skill_memes = 10            # 群技能:梗条数上限
skill_rules = 10            # 群技能:群规条数上限
skill_members = 20          # 群技能:成员条数上限
skill_habits_per_member = 5 # 每位成员的习惯条数上限

# 语音(可选)。省略整节 = 语音关闭:私聊语音只记为 [语音],不注册 send_voice 工具。
# 语音转写失败时私聊内容为 [语音识别失败]。
# [voice]
# ffmpeg = "ffmpeg"                 # 音频转换程序
# media_timeout_seconds = 30
# [voice.asr]                       # FunASR 守护进程;host/port 与 unix_path 二选一
# host = "127.0.0.1"
# port = 10095
# language = "auto"
# [voice.tts]                       # SoVITS 守护进程
# host = "127.0.0.1"
# port = 10096
# language = "zh"
# path_rules = [{ remote = "/远端数据目录", local = "/本机数据目录" }]

# 编程代理(M5,可选)。省略整节 = 关闭。整节一经出现即完整校验(enabled = false 时亦然)。
# 上游 Responses 地址与密钥取自 [provider];token_secret 与 imagegen.api_key 须为 "secret:<名>"。
# [coding]
# enabled = true
# token_secret = "secret:coding_token"    # 沙箱令牌的 HMAC 密钥(在 secrets 中定义)
# [coding.http]                           # 网关与桥接共用一个 HTTP 服务
# host = "0.0.0.0"
# port = 8000
# public_base_url = "http://cgbot:8000"   # 沙箱与 NapCat 访问本服务的地址
# [coding.docker]
# host = "http://dsh-docker-proxy:2375"
# sandbox_image = "cgbot-sandbox:latest"
# network = "dsh_caged_internal"
# host_data_dir = "/home/klp/cgbot-data"  # 宿主机绝对路径(容器内外须同一路径)
# egress_proxy = ""                       # 可选;空 = 无代理
# idle_seconds = 3600
# container_prefix = "cgbot-sbx-"
# [coding.codex]
# model = "..."
# reasoning_effort = "medium"
# appserver_port = 8765
# [coding.concurrency]
# per_user = 4
# degraded = 1
# degrade_failures = 3
# degrade_window_seconds = 60
# recover_after_seconds = 3600
# [coding.bridge]
# max_file_bytes = 536870912
# chunk_bytes = 2097152
# temp_dir = "data/bridge"                 # 相对路径按配置文件目录解析
# file_ttl_seconds = 86400
# [coding.imagegen]                       # 可选;省略 = 图像生成不可用
# base_url = "https://..."
# api_key = "secret:imagegen_key"
# model = "..."
# mode = "..."
# timeout_seconds = 600
# proxy = ""
# max_concurrency = 2

[logging]
level = "INFO"       # DEBUG / INFO / WARNING / ERROR / CRITICAL
