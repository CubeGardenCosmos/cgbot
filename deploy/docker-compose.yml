# cgbot compose service (M5). Runs ONLY the `cgbot` service, project name `cgbot`.
#
# Host layout (created manually once; see docs/reference/deploy.md):
#   $CGBOT_RUN_DIR/docker-compose.yml   this file (copied by deploy/deploy.sh)
#   $CGBOT_RUN_DIR/config.toml          real config (0644, no secrets)
#   $CGBOT_RUN_DIR/secrets.toml         real secrets (0600, never in git)
#   $CGBOT_RUN_DIR/state/               bot SQLite / bridge temp (-> /app/data)
#   $CGBOT_HOST_DATA_DIR/               sandbox workspaces (same path inside bot)
#
# Start: deploy/deploy.sh --up   (never `compose up` without the external networks existing)

name: cgbot

services:
  cgbot:
    image: cgbot:${CGBOT_TAG:-latest}
    container_name: cgbot          # DNS name for NapCat (cgbot_net) and sandboxes
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    # Root inside the container is required to chown per-user workspaces.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true", "label:disable"]   # SELinux host: bind mounts (as the old manager)
    pids_limit: 512
    mem_limit: 1g
    cpus: 2
    environment:
      TZ: UTC
    volumes:
      - ./config.toml:/app/config/config.toml:ro
      - ./secrets.toml:/run/secrets/cgbot.toml:ro
      - ./state:/app/data
      # Sandbox bind mounts are resolved by the HOST Docker daemon, so the path must match.
      - ${CGBOT_HOST_DATA_DIR:-/data/cgbot-data}:${CGBOT_HOST_DATA_DIR:-/data/cgbot-data}
    extra_hosts: ["host.docker.internal:host-gateway"]   # imagegen proxy on the host
    networks:
      - caged_internal         # sandboxes reach http://cgbot:8000 (gateway/bridge)
      - caged_ctl              # reaches caged-docker-proxy:2375 (Docker API allowlist)
      - cgbot_net              # NapCat connects to ws://cgbot:6200/ws; bot has LAN/Internet egress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Networks caged_internal and caged_ctl are owned by the caged/ stack (external, internal).
# Network cgbot_net is shared with NapCat (external, bridged).
networks:
  caged_internal:
    external: true
  caged_ctl:
    external: true
  cgbot_net:
    external: true
