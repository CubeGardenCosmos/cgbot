[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cgdl"
version = "0.1.0"
description = "MuseScore search and score downloads for cgbot sandbox agents"
requires-python = ">=3.10"
# 沙箱镜像默认 Python 已预装 httpx 与 playwright(见 sandbox/requirements.txt),安装时使用 --no-deps。
dependencies = ["httpx>=0.27", "playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
cgdl = "cgdl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 在线测试默认跳过,需要 `pytest -m integration` 显式运行。
addopts = "-m 'not integration'"
markers = ["integration: 访问真实 musescore.com 与本机 Chromium 的在线测试(默认跳过)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
