[project]
name = "cgbot"
version = "0.1.0"
description = "LLM-native QQ bot framework with Codex sandbox integration"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Creeper23456"}
]
requires-python = ">=3.12"
keywords = ["qq", "bot", "llm", "agent", "napcat", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "websockets>=13",
    "httpx>=0.27",
    "pilk>=0.2.4",
    "aiohttp>=3.14.5",
    "pillow>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/CubeGardenCosmos/cgbot"
Repository = "https://github.com/CubeGardenCosmos/cgbot.git"
Issues = "https://github.com/CubeGardenCosmos/cgbot/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests/omp"]
markers = [
    "integration: 真实边界集成测试,默认跳过,须用户授权",
    "platform: 平台检查",
]
addopts = "-m 'not integration and not platform'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
extraPaths = ["tests/omp"]
typeCheckingMode = "standard"
