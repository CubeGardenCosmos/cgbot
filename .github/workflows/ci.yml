name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
    
    - name: Set up Python
      run: uv python install 3.12
    
    - name: Install dependencies
      run: uv sync
    
    - name: Run ruff
      run: uv run ruff check .
    
    - name: Run pytest
      run: uv run pytest
    
    - name: Run egress tests
      run: uv run python -m unittest caged.egress.test_config
      continue-on-error: true
