# cgbot 部署配置模板(M5)。复制为宿主机运行目录的 config.toml 后,补全带"【占位】"标注的项,
# 并删除这些标注(deploy/deploy.sh 发现残留标注会拒绝启动)。
# 容器内路径:本文件挂载为 /app/config/config.toml;数据目录 /app/data。
# 密钥只写引用名;值在 secrets.toml(0600),挂载为 /run/secrets/cgbot.toml。

[napcat]
host = "0.0.0.0"     # 容器内监听;不向宿主机发布端口,仅通过外部网络的 NapCat 可连入
port = 6200
path = "/ws"

[scope]
# 省略整节或留空 = 全部拒绝。这是安全的默认值:未补全时机器人不会响应任何人。
friends = []   # 【占位】补全好友 QQ 号列表;留空 = 全部拒绝(安全的默认值)
groups = []    # 【占位】补全群号列表;留空 = 全部拒绝
all_friends = false  # 是否对所有真实好友开放私聊;默认 false
# owner = 123456789   # 【占位】主人 QQ 号(可选);取消注释并填入真实值后删除本标注

[provider]
base_url = "https://api.cicori.com/v1"      # 兼容 Responses 与 Chat Completions
model = "deepseek-v4.1-flash"
wire_api = "responses"
retry_attempts = 2
retry_backoff = [2.0, 5.0]
context_window = 128000                     # [推论] 未向上游查证;压缩阈值按此计算
api_key_ref = "provider_api_key"

[provider.reasoning]
summary = "low"      # 压缩摘要
private = "high"     # 日常私聊
planning = "max"     # 任务规划(设计待定)
group = "low"        # 群聊轮次

[provider.vision]
enabled = true                  # 2026-11-05:聊天图片作为 input_image 发给模型(模型为多模态)
max_images_per_turn = 4         # 单条消息最多取几张
recent_image_turns = 3          # 仅最近 N 个带图用户轮次发真实图片,更早的退化为 [图片] 文字
max_edge = 1536                 # 长边上限(像素);超出缩小后重编码
retention_images = 200          # 每个私聊/群范围最多保留的图片数
retention_days = 30             # 图片保留天数

# 有序降级(2026-11-07):主模型(上面的 model)失败后按此顺序依次尝试;每一轮对话都从主模型重新开始。
# 触发条件:适配器自身的重试用尽后仍报错(429/5xx/超时/4xx)。流式输出一旦已产生内容就不再降级。
# 省略的项继承 [provider];重试设置与 [provider.reasoning] 档位对所有成员一致。
[[provider.fallbacks]]
model = "gemini-3.8-flash"
wire_api = "gemini"                            # Gemini 原生 generateContent,仅此一种线协议可用
base_url = "https://api.cicori.com/v1beta"     # Gemini 原生接口根地址(注意不是 /v1)

[storage]
data_dir = "/app/data"   # 绝对路径,对应宿主机运行目录下的 state/

[group]
wake_keywords = ["【占位】"]  # 【占位】补全群唤醒关键词
mute_keywords = []
idle_timeout_seconds = 600
max_turns = 30
skill_topics = 8
skill_memes = 10
skill_rules = 10
skill_members = 20
skill_habits_per_member = 5
timezone = "Asia/Shanghai"   # IANA 时区:群门控睡眠/主动时段、日志时间戳与模型所见消息时间戳均按此计,不依赖进程 TZ

# 语音未启用:省略 [voice]。启用前须确认 ASR/TTS 守护进程地址在容器内可达。

[search]
engines = ["bing", "baidu", "bilibili"]
timeout_seconds = 30

[search.gemini]
enabled = true                            # 直接调用上游中转的 Gemini generateContent(google_search)
base_url = "https://api.cicori.com/v1beta"
model = "gemini-3.1-flash-lite"

[search.x]
enabled = true                            # x_search 工具:grok 原生 x_search(Responses API)搜索 X 平台
base_url = "https://api.cicori.com/v1"
model = "grok-4.7"
# 2026-11-07:CLIProxyAPI 目前会剥离 x_search 工具(上游不执行搜索),因此实际回退到限定 X 的 Gemini 搜索;修复后自动改用 Grok。

[logging]
level = "INFO"

[coding]
enabled = true
token_secret = "secret:coding_token"      # HMAC 密钥;每个沙盒令牌由它派生
upstream_api_key = "secret:gateway_api_key"  # 网关转发上游的专用密钥

[coding.http]                             # 网关 + bridge 共用一个 aiohttp 服务
host = "0.0.0.0"
port = 8000
public_base_url = "http://cgbot:8000"     # 沙盒与 NapCat 访问本服务的地址

[coding.docker]
host = "http://caged-docker-proxy:2375"     # caged/ 的 Docker API 白名单代理
sandbox_image = "cgbot-sandbox:latest"
network = "caged_internal"
host_data_dir = "/data/cgbot-data"    # 【占位】宿主机绝对路径,容器内同路径挂载
egress_proxy = "http://caged-egress:7890"
idle_seconds = 3600
container_prefix = "cgbot-sbx-"

[coding.codex]
model = "deepseek-v4.1-flash"
reasoning_effort = "medium"
appserver_port = 8765

[coding.concurrency]
per_user = 4
degraded = 1
degrade_failures = 3
degrade_window_seconds = 60
recover_after_seconds = 3600

[coding.bridge]
max_file_bytes = 536870912
chunk_bytes = 2097152
temp_dir = "/app/data/bridge"
file_ttl_seconds = 86400

# [coding.imagegen] 省略 = 图像生成不可用。需要时补全 base_url/api_key(secret:imagegen_key)/model/mode 等。
