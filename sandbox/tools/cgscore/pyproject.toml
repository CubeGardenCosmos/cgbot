[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cgscore"
version = "0.1.0"
description = "Score preprocessing: MusicXML/MIDI -> per-part MIDI files + plan.json (DAW score work)"
requires-python = ">=3.10"
# 沙箱镜像默认 Python 的依赖由 sandbox/requirements.txt 预装(含 mido),安装时使用 --no-deps。
dependencies = ["mido>=1.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
cgscore = "cgscore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
