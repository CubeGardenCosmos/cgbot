# Exact allowlist for caged services. Anything not matched is denied (403).
# NOTE: The following endpoints are denied: /images/*, /containers/.../logs,
# /containers/.../wait and all other Docker API endpoints not explicitly listed.
global
    log stdout format raw daemon
    maxconn 256

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 0
    timeout server 0
    timeout tunnel 0

frontend dockerfront
    bind :2375
    http-request set-var(txn.path) path
    acl api_ver path_reg ^(/v[0-9.]+)?(/.*)$
    # path without optional /vX.Y prefix
    http-request set-var(txn.p) path,regsub(^/v[0-9.]+,)

    acl m_get    method GET HEAD
    acl m_post   method POST
    acl m_delete method DELETE

    acl p_version   var(txn.p) -m str /version
    acl p_ping      var(txn.p) -m str /_ping
    acl p_clist     var(txn.p) -m str /containers/json
    acl p_ccreate   var(txn.p) -m str /containers/create
    acl p_cinspect  var(txn.p) -m reg ^/containers/[a-zA-Z0-9_.-]+/json$
    acl p_cstart    var(txn.p) -m reg ^/containers/[a-zA-Z0-9_.-]+/(start|stop)$
    acl p_cexec     var(txn.p) -m reg ^/containers/[a-zA-Z0-9_.-]+/exec$
    acl p_cdel      var(txn.p) -m reg ^/containers/[a-zA-Z0-9_.-]+$
    acl p_estart    var(txn.p) -m reg ^/exec/[a-zA-Z0-9]+/start$
    acl p_einspect  var(txn.p) -m reg ^/exec/[a-zA-Z0-9]+/json$
    acl p_net       var(txn.p) -m reg ^/networks/[a-zA-Z0-9_.-]+$

    acl get_ok  var(txn.p) -m reg ^/(version|_ping|containers/json)$
    acl get_ok  var(txn.p) -m reg ^/containers/[a-zA-Z0-9_.-]+/json$
    acl get_ok  var(txn.p) -m reg ^/exec/[a-zA-Z0-9]+/json$
    acl get_ok  var(txn.p) -m reg ^/networks/[a-zA-Z0-9_.-]+$
    acl post_ok var(txn.p) -m str /containers/create
    acl post_ok var(txn.p) -m reg ^/containers/[a-zA-Z0-9_.-]+/(start|stop|exec)$
    acl post_ok var(txn.p) -m reg ^/exec/[a-zA-Z0-9]+/start$

    http-request allow if m_get get_ok
    http-request allow if m_post post_ok
    http-request allow if m_delete p_cdel
    http-request deny deny_status 403
    default_backend docker

backend docker
    server dockersock /var/run/docker.sock
