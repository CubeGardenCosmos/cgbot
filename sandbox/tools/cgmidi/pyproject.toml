[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cgmidi"
version = "0.1.0"
description = "MIDI preprocessing CLI for cgbot sandbox agents (built on mido)"
requires-python = ">=3.10"
# 沙箱镜像默认 Python 的依赖由 sandbox/requirements.txt 预装(含 mido),安装时使用 --no-deps。
dependencies = ["mido>=1.3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
cgmidi = "cgmidi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 真实文件的非门禁检查默认跳过,需要 `uv run pytest -m realfiles` 显式运行。
addopts = "-m 'not realfiles'"
markers = ["realfiles: 对 /tmp/cgtest 下真实 MIDI 文件的非门禁检查(默认跳过)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
